<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klock</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>
          <path d="M12 7v5l3.5 2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Klock</h1>
    </div>
    <div class="topRight">
      <button type="button" class="infoBtn" id="infoBtn" onclick="toggleInfo()" title="Info">i</button>
      <div class="langWrap">
        <select id="langSel" onchange="setLang(this.value)">
          <option value="en">EN</option>
          <option value="ru">RU</option>
          <option value="vi">VI</option>
          <option value="zh">ZH</option>
          <option value="es">ES</option>
        </select>
      </div>
    </div>
  </div>

  <div class="infoPanel hidden" id="infoPanel">
    <button type="button" class="infoClose" onclick="toggleInfo()">✕</button>
    <ul>
      <li data-i18n="infoEncrypt"></li>
      <li data-i18n="infoDecrypt"></li>
      <li data-i18n="infoPrivacy"></li>
      <li data-i18n="infoSize"></li>
      <li data-i18n="infoRetention"></li>
    </ul>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabEncBtn" data-i18n="tabEncrypt" onclick="showTab('enc')"></div>
    <div class="tab" id="tabDecBtn" data-i18n="tabDecrypt" onclick="showTab('dec')"></div>
  </div>

  <!-- ENCRYPT -->
  <div class="panel active" id="panelEnc">
    <label data-i18n="secret"></label>
    <input id="encSecret" type="text" autocomplete="off" />
    <label data-i18n="message"></label>
    <div class="msgWrap">
      <textarea id="encMessage"></textarea>
      <button type="button" class="fileIconBtn" id="attachBtn" onclick="document.getElementById('encFile').click()" title="Attach file">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 10.5L12.5 19a4.5 4.5 0 01-6.36-6.36L14.5 4.28a3 3 0 014.24 4.24L10.4 17.17a1.5 1.5 0 01-2.12-2.12l7.07-7.07" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="fileChip hidden" id="encFileChip">
        <span id="encFileChipName"></span>
        <button type="button" class="fileChipClear" id="encFileClear" onclick="clearFile()" title="Remove">✕</button>
      </div>
    </div>
    <input id="encFile" type="file" class="hidden" onchange="onFilePicked()" />

    <label data-i18n="unlock"></label>
    <div class="row">
      <select id="encTz"></select>
      <input id="encTime" type="datetime-local" step="1" />
    </div>
    <div class="toggleRow">
      <span>Save encrypted file on server forever</span>
      <button type="button" class="switch" id="permSwitch" onclick="togglePermanent()" role="switch" aria-checked="false"><span class="knob"></span></button>
    </div>
    <div class="payBox hidden" id="payBox">
      <div class="payAmount">1 USDT</div>
      <div class="payRow" data-net="bsc">
        <div class="payInfo">
          <span class="payNet">BSC</span>
          <span class="payAddr" onclick="copyPayAddr(this)">0xb11be01e0d81b20f373aa0de7058946765e68d97</span>
        </div>
        <button type="button" class="paidBtn" onclick="checkPayment('bsc')">Paid</button>
      </div>
      <div class="payRow" data-net="eth">
        <div class="payInfo">
          <span class="payNet">ETH</span>
          <span class="payAddr" onclick="copyPayAddr(this)">0xb11be01e0d81b20f373aa0de7058946765e68d97</span>
        </div>
        <button type="button" class="paidBtn" onclick="checkPayment('eth')">Paid</button>
      </div>
      <div class="payStatus" id="payStatus"></div>
    </div>
    <button id="encBtn" onclick="doEncrypt()" data-i18n="encryptBtn"></button>
    <div class="msg" id="encMsg"></div>
    <div class="out" id="encFileOut">
      <div class="label" data-i18n="fileLabel"></div>
      <a id="encFileDownload" class="btnWhite btnlike" download>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="downloadFile"></span>
      </a>
    </div>
    <div class="out" id="encOut">
      <div class="labelRow">
        <div class="label" data-i18n="linkLabel"></div>
        <span class="copyStatus" id="copyStatus"></span>
      </div>
      <div id="encLink"></div>
      <div class="btnRow">
        <button class="secondary" onclick="copyLink()" data-i18n="copyBtn"></button>
        <button class="secondary hidden" id="shareBtn" onclick="shareLink()" data-i18n="shareBtn"></button>
      </div>
    </div>
  </div>

  <!-- DECRYPT -->
  <div class="panel" id="panelDec">
    <div class="step active" id="decStep1">
      <label data-i18n="decryptInput"></label>
      <div class="msgWrap">
        <input id="decInput" type="text" autocomplete="off" />
        <button type="button" class="fileIconBtn" id="decAttachBtn" onclick="document.getElementById('decFile').click()" title="Upload encrypted file">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 10.5L12.5 19a4.5 4.5 0 01-6.36-6.36L14.5 4.28a3 3 0 014.24 4.24L10.4 17.17a1.5 1.5 0 01-2.12-2.12l7.07-7.07" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="fileChip hidden" id="decFileChip">
          <span id="decFileChipName"></span>
          <button type="button" class="fileChipClear" onclick="clearDecFile()" title="Remove">✕</button>
        </div>
      </div>
      <input id="decFile" type="file" class="hidden" accept=".klock,.json,application/json" onchange="onDecFilePicked()" />
      <button id="decCheckBtn" onclick="doDecryptCheck()" data-i18n="decryptBtn"></button>
    </div>

    <div class="step" id="decStep2">
      <label data-i18n="enterSecret"></label>
      <input id="decSecret" type="text" autocomplete="off" />
      <button id="decFinalBtn" onclick="doDecryptFinal()" data-i18n="confirmBtn"></button>
      <button class="link" onclick="resetDecrypt()" data-i18n="backLink"></button>
    </div>

    <div class="msg" id="decMsg"></div>
    <div class="out" id="decOut">
      <div class="label" data-i18n="result"></div>
      <div id="decOutText" class="out-text"></div>
      <div id="decOutFile" class="hidden">
        <img id="decOutImg" class="hidden" />
        <div id="decOutFileName" class="fileName"></div>
        <a id="decOutDownload" class="secondary btnlike" download onclick="notifyDownloaded()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="downloadFile"></span>
        </a>
      </div>
    </div>
  </div>
</div>

<script src="/i18n.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
