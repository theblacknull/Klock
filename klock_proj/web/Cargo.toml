[package]
name = "klock-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "klock-web"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
tower = { version = "0.4", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
